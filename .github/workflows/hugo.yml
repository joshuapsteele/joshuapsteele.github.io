# Build and deploy the Hugo site to GitHub Pages.
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Check hourly for Micro.blog syndication links. The gate job below skips the
  # build and deploy entirely when nothing has changed, so a quiet hour costs
  # about 20 seconds instead of a full rebuild and redeploy.
  schedule:
    - cron: "17 * * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Only the Pages deployment needs to be serialized. Leaving the build
# unconstrained means a push starts building immediately instead of queueing
# behind an unrelated run.
defaults:
  run:
    shell: bash

jobs:
  # Decide whether this run has anything new to publish.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Refresh Micro.blog syndication links
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: python3 scripts/fetch_syndication_links.py

      - name: Decide whether to build
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet -- data/syndication.json; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No syndication changes::Nothing new from Micro.blog; skipping build and deploy."
            exit 0
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"

          # Commit the refreshed file so the next scheduled run compares against
          # an up-to-date baseline. Without this the gate would fire on every
          # run once syndication.json drifted from the committed copy.
          # Pushing with GITHUB_TOKEN does not retrigger this workflow, so the
          # build and deploy jobs below still run as part of this same run.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/syndication.json
          git commit -m "Refresh Micro.blog syndication links [skip ci]"
          git push || echo "::warning title=Syndication baseline not pushed::A newer commit landed first; the next run will pick it up."

  # Build job
  build:
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.160.1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # enableGitInfo needs full history for lastmod dates.
          fetch-depth: 0

      - name: Install Hugo
        run: |
          curl -L "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -o /tmp/hugo.tar.gz
          mkdir -p /tmp/hugo
          tar -xzf /tmp/hugo.tar.gz -C /tmp/hugo hugo
          echo "/tmp/hugo" >> "$GITHUB_PATH"
          /tmp/hugo/hugo version

      - name: Fetch popular posts from Tinylytics
        env:
          TINYLYTICS_API_KEY: ${{ secrets.TINYLYTICS_API_KEY }}
          TINYLYTICS_SITE_ID: ${{ secrets.TINYLYTICS_SITE_ID || '1783' }}
          TINYLYTICS_SITE_DOMAIN: joshuapsteele.com
        run: |
          if ! python3 scripts/fetch_popular_posts.py; then
            echo "::warning title=Popular posts fetch failed::Tinylytics fetch failed; building with the existing data/popular.json (may be stale). Verify the TINYLYTICS_API_KEY and TINYLYTICS_SITE_ID secrets."
          fi

      - name: Fetch Micro.blog syndication links
        continue-on-error: true
        run: python3 scripts/fetch_syndication_links.py

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://joshuapsteele.com/"

      - name: Verify Amazon Associates disclosures
        run: python3 scripts/check-amazon-disclosures.py

      - name: Send outgoing Webmentions
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: |
          python3 scripts/send_webmentions.py \
            --public-dir public \
            --feed public/notes/feed.json \
            --feed public/blog/feed.json \
            --limit 5 \
            --since-days 30

      - name: Archive Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory "public" \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Verify well-known files in Pages artifact
        run: |
          if ! tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx './.well-known/webfinger'; then
            echo "::error title=Missing WebFinger file::The Pages artifact does not contain .well-known/webfinger."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    # Serialize only the deployment itself.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        env:
          NODE_OPTIONS: --no-deprecation
        # Pin the Node 24 update until actions/deploy-pages publishes the next tag.
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
